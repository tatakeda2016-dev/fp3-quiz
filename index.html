<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FP3級 練習問題</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    height: fit-content;
  }

  /* Top screen */
  #top { text-align: center; padding: 12px 0; }
  .top-icon { font-size: 52px; margin-bottom: 12px; }
  .top-title { font-size: 24px; font-weight: 800; color: #1e293b; margin-bottom: 4px; }
  .top-sub { font-size: 14px; color: #64748b; margin-bottom: 24px; }
  .subject-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 20px;
  }
  .subject-btn {
    padding: 12px 8px; border-radius: 10px; border: 1.5px solid #e2e8f0;
    background: #f8fafc; font-size: 13px; font-weight: 600;
    color: #334155; cursor: pointer; font-family: inherit;
    transition: all 0.15s; line-height: 1.4;
  }
  .subject-btn.selected {
    background: #eff6ff; border-color: #3b82f6; color: #1d4ed8;
  }
  .subject-btn:active { opacity: 0.8; }
  .count-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .count-btn {
    padding: 10px 24px; border-radius: 99px; border: 1.5px solid #e2e8f0;
    background: #f8fafc; font-size: 14px; font-weight: 600;
    color: #334155; cursor: pointer; font-family: inherit;
  }
  .count-btn.selected { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
  .start-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(90deg, #1e3a5f, #2563eb);
    color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Loading */
  #loading { text-align: center; padding: 40px 0; display: none; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid #e2e8f0;
    border-top-color: #3b82f6; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 15px; color: #64748b; font-weight: 600; }
  .loading-sub { font-size: 13px; color: #94a3b8; margin-top: 6px; }

  /* Error */
  #error { display: none; text-align: center; padding: 20px 0; }
  .error-icon { font-size: 40px; margin-bottom: 10px; }
  .error-text { font-size: 14px; color: #dc2626; margin-bottom: 16px; line-height: 1.6; }
  .retry-btn {
    padding: 12px 28px; background: #1e3a5f; color: #fff;
    border: none; border-radius: 10px; font-size: 14px;
    font-weight: 700; cursor: pointer; font-family: inherit;
  }

  /* Quiz */
  #quiz { display: none; }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .tag {
    background: #1e3a5f; color: #fff; border-radius: 6px;
    padding: 3px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
  }
  .subject-label { font-size: 13px; color: #64748b; font-weight: 500; }
  .progress-bar {
    height: 6px; background: #e2e8f0; border-radius: 99px;
    overflow: hidden; margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #3b82f6, #06b6d4);
    border-radius: 99px; transition: width 0.4s ease;
  }
  .progress-text { font-size: 12px; color: #94a3b8; text-align: right; margin-bottom: 18px; }
  .question-box {
    background: #f8fafc; border-radius: 12px; padding: 16px;
    margin-bottom: 16px; border: 1px solid #e2e8f0;
  }
  .question-text { font-size: 15px; line-height: 1.75; color: #1e293b; font-weight: 600; }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .choice-btn {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 14px 16px; border-radius: 10px; cursor: pointer;
    text-align: left; font-size: 14px; line-height: 1.6;
    border: 1.5px solid #e2e8f0; background: #f8fafc;
    color: #1e293b; font-family: inherit; font-weight: 500; width: 100%;
  }
  .choice-btn:active { opacity: 0.8; }
  .choice-label {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; border-radius: 6px;
    background: rgba(0,0,0,0.08); font-size: 12px;
    font-weight: 700; flex-shrink: 0; margin-top: 1px;
  }
  .choice-btn.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; }
  .choice-btn.wrong   { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
  .explanation {
    border-radius: 10px; padding: 14px 16px;
    margin-bottom: 16px; font-size: 14px; display: none;
  }
  .explanation.correct { background: #f0fdf4; border-left: 4px solid #22c55e; }
  .explanation.wrong   { background: #fff7ed; border-left: 4px solid #f97316; }
  .exp-title { font-weight: 700; }
  .exp-text  { margin-top: 6px; color: #374151; line-height: 1.7; }
  .next-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(90deg, #1e3a5f, #2563eb);
    color: #fff; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit; display: none;
  }

  /* Result */
  #result { display: none; }
  .result-header { text-align: center; margin-bottom: 24px; }
  .result-icon { font-size: 48px; display: block; margin-bottom: 8px; }
  .result-title { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 12px; }
  .score-display { font-size: 56px; font-weight: 900; line-height: 1; }
  .score-num { color: #2563eb; }
  .score-total { font-size: 28px; color: #94a3b8; }
  .score-label { font-size: 15px; color: #64748b; margin-top: 8px; font-weight: 600; }
  .review-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
  .review-item {
    background: #f8fafc; border-radius: 10px; padding: 14px 16px;
    border-left: 3px solid #e2e8f0;
  }
  .review-item.correct { border-left-color: #22c55e; }
  .review-item.wrong   { border-left-color: #ef4444; }
  .review-badge {
    display: inline-block; padding: 2px 10px; border-radius: 99px;
    font-size: 12px; font-weight: 700; margin-bottom: 6px;
  }
  .review-badge.correct { background: #dcfce7; color: #16a34a; }
  .review-badge.wrong   { background: #fee2e2; color: #dc2626; }
  .review-q { font-size: 13px; font-weight: 600; color: #1e293b; line-height: 1.6; margin-bottom: 6px; }
  .review-answer { font-size: 13px; color: #dc2626; font-weight: 600; margin-bottom: 6px; }
  .review-exp { font-size: 13px; color: #475569; line-height: 1.7; }
  .result-btns { display: flex; gap: 10px; }
  .restart-btn {
    flex: 1; padding: 14px;
    background: linear-gradient(90deg, #1e3a5f, #2563eb);
    color: #fff; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .back-btn {
    flex: 1; padding: 14px; background: #f1f5f9;
    color: #334155; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<div class="card">

  <!-- Top -->
  <div id="top">
    <div class="top-icon">📊</div>
    <h1 class="top-title">FP3級 練習問題</h1>
    <p class="top-sub">AIが毎回ランダムに問題を生成します</p>
    <div class="subject-grid" id="subject-grid">
      <button class="subject-btn selected" data-value="ライフプランニング・資金計画" onclick="selectSubject(this)">📅 ライフプランニング<br>・資金計画</button>
      <button class="subject-btn" data-value="リスク管理（保険）" onclick="selectSubject(this)">🛡️ リスク管理<br>（保険）</button>
      <button class="subject-btn" data-value="金融資産運用" onclick="selectSubject(this)">📈 金融資産運用</button>
      <button class="subject-btn" data-value="タックスプランニング" onclick="selectSubject(this)">🧾 タックス<br>プランニング</button>
      <button class="subject-btn" data-value="不動産" onclick="selectSubject(this)">🏠 不動産</button>
      <button class="subject-btn" data-value="相続・事業承継" onclick="selectSubject(this)">📜 相続・事業承継</button>
    </div>
    <div class="count-row">
      <button class="count-btn selected" data-value="3" onclick="selectCount(this)">3問</button>
      <button class="count-btn" data-value="5" onclick="selectCount(this)">5問</button>
      <button class="count-btn" data-value="10" onclick="selectCount(this)">10問</button>
    </div>
    <button class="start-btn" id="start-btn" onclick="startQuiz()">問題を生成する ✨</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p class="loading-text">問題を生成中...</p>
    <p class="loading-sub">AIが問題を作っています、少々お待ちください</p>
  </div>

  <!-- Error -->
  <div id="error">
    <div class="error-icon">⚠️</div>
    <p class="error-text" id="error-msg">問題の生成に失敗しました。<br>もう一度お試しください。</p>
    <button class="retry-btn" onclick="showTop()">トップに戻る</button>
  </div>

  <!-- Quiz -->
  <div id="quiz">
    <div class="header">
      <span class="tag">FP3級</span>
      <span class="subject-label" id="subject-label"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <p class="progress-text" id="progress-text"></p>
    <div class="question-box"><p class="question-text" id="question-text"></p></div>
    <div class="choices" id="choices"></div>
    <div class="explanation" id="explanation">
      <span class="exp-title" id="exp-title"></span>
      <p class="exp-text" id="exp-text"></p>
    </div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ →</button>
  </div>

  <!-- Result -->
  <div id="result">
    <div class="result-header">
      <span class="result-icon" id="result-icon"></span>
      <h1 class="result-title">結果発表</h1>
      <div class="score-display">
        <span class="score-num" id="score-num"></span>
        <span class="score-total" id="score-total"></span>
      </div>
      <p class="score-label" id="score-label"></p>
    </div>
    <div class="review-list" id="review-list"></div>
    <div class="result-btns">
      <button class="back-btn" onclick="showTop()">分野を変える</button>
      <button class="restart-btn" onclick="startQuiz()">もう一度 ✨</button>
    </div>
  </div>

</div>

<script>
let selectedSubject = "ライフプランニング・資金計画";
let selectedCount = 3;
let questions = [];
let current = 0;
let answered = false;
let userAnswers = [];
const labels = ["ア", "イ", "ウ"];

function selectSubject(btn) {
  document.querySelectorAll(".subject-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  selectedSubject = btn.dataset.value;
}

function selectCount(btn) {
  document.querySelectorAll(".count-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  selectedCount = parseInt(btn.dataset.value);
}

function show(id) {
  ["top","loading","error","quiz","result"].forEach(s => {
    document.getElementById(s).style.display = s === id ? (s === "top" || s === "result" ? "block" : "block") : "none";
  });
}

function showTop() { show("top"); }

async function startQuiz() {
  show("loading");
  try {
    questions = await generateQuestions(selectedSubject, selectedCount);
    current = 0;
    answered = false;
    userAnswers = [];
    show("quiz");
    render();
  } catch(e) {
    document.getElementById("error-msg").textContent = "問題の生成に失敗しました。\n" + e.message;
    show("error");
  }
}

async function generateQuestions(subject, count) {
  const prompt = `FP3級（ファイナンシャルプランニング技能士3級）の「${subject}」分野から、三択問題を${count}問作成してください。

以下の条件を守ってください：
- 実際のFP3級試験に出題されうる内容
- 選択肢は必ず3つ
- 難易度は標準的（合否ライン付近）
- 問題が重複しないよう多様なトピックを選ぶ

以下のJSON形式のみで返答してください（コードブロックや説明文は一切不要）：
[
  {
    "question": "問題文",
    "choices": ["選択肢1", "選択肢2", "選択肢3"],
    "answer": 正解のインデックス（0・1・2のいずれか）,
    "explanation": "解説文（100字程度）"
  }
]`;

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });

  if (!res.ok) throw new Error("APIエラー: " + res.status);

  const data = await res.json();
  const text = data.content.map(c => c.text || "").join("");
  const clean = text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(clean);
  if (!Array.isArray(parsed) || parsed.length === 0) throw new Error("問題の解析に失敗しました");
  return parsed;
}

function render() {
  const q = questions[current];
  const total = questions.length;
  document.getElementById("subject-label").textContent = selectedSubject;
  document.getElementById("progress-fill").style.width = (current / total * 100) + "%";
  document.getElementById("progress-text").textContent = (current + 1) + " / " + total;
  document.getElementById("question-text").textContent = q.question;

  const choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";
  q.choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = '<span class="choice-label">' + labels[i] + '</span>' + c;
    btn.onclick = () => select(i);
    choicesEl.appendChild(btn);
  });

  const exp = document.getElementById("explanation");
  exp.style.display = "none";
  exp.className = "explanation";
  document.getElementById("next-btn").style.display = "none";
  answered = false;
}

function select(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const btns = document.querySelectorAll(".choice-btn");
  btns.forEach((btn, i) => {
    if (i === q.answer) btn.classList.add("correct");
    else if (i === idx) btn.classList.add("wrong");
    btn.onclick = null;
  });

  const correct = idx === q.answer;
  userAnswers.push({ idx, correct });

  const exp = document.getElementById("explanation");
  exp.style.display = "block";
  exp.className = "explanation " + (correct ? "correct" : "wrong");
  document.getElementById("exp-title").textContent = correct ? "✓ 正解！" : "✗ 不正解";
  document.getElementById("exp-title").style.color = correct ? "#15803d" : "#c2410c";
  document.getElementById("exp-text").textContent = q.explanation;

  const nextBtn = document.getElementById("next-btn");
  nextBtn.style.display = "block";
  nextBtn.textContent = current + 1 < questions.length ? "次の問題へ →" : "結果を見る →";
}

function nextQuestion() {
  current++;
  if (current < questions.length) { render(); }
  else { showResult(); }
}

function showResult() {
  show("result");
  const score = userAnswers.filter(a => a.correct).length;
  const total = questions.length;
  document.getElementById("result-icon").textContent = score === total ? "🏆" : score >= total * 0.6 ? "📘" : "📝";
  document.getElementById("score-num").textContent = score;
  document.getElementById("score-total").textContent = " / " + total;
  document.getElementById("score-label").textContent =
    score === total ? "パーフェクト！素晴らしい！" : score >= total * 0.6 ? "合格ライン突破！" : "もう少し復習しましょう";

  const list = document.getElementById("review-list");
  list.innerHTML = "";
  questions.forEach((q, i) => {
    const a = userAnswers[i];
    const item = document.createElement("div");
    item.className = "review-item " + (a.correct ? "correct" : "wrong");
    item.innerHTML =
      '<span class="review-badge ' + (a.correct ? "correct" : "wrong") + '">' + (a.correct ? "✓ 正解" : "✗ 不正解") + '</span>' +
      '<p class="review-q">Q' + (i+1) + '. ' + q.question + '</p>' +
      (!a.correct ? '<p class="review-answer">正解：' + q.choices[q.answer] + '</p>' : '') +
      '<p class="review-exp">' + q.explanation + '</p>';
    list.appendChild(item);
  });
}
</script>
</body>
</html>
